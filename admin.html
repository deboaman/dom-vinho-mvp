function dl(name,data){return(window.claude?claude.use('downloads'):Promise.resolve(null)).then(function(d){if(d)return d.save({filename:name,data:data});var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click()})}
/* publicação */
function build(){var M=[],V=[],WP={};S.cats.forEach(function(c){if(c.k==='vinhos')return;var it=S.items.filter(function(i){return i.cat===c.k&&i.on});if(!it.length)return;var gl=[];it.forEach(function(i){if(gl.indexOf(i.grp)<0)gl.push(i.grp)});it.sort(function(a,b){return gl.indexOf(a.grp)-gl.indexOf(b.grp)});var rows=[],g=null;it.forEach(function(i){if(i.grp&&i.grp!==g){rows.push(['#',i.grp])}g=i.grp;var d=i.desc;if(c.k==='combos'&&!d)d=(i.inc||[]).map(function(x){var m=S.items.find(function(y){return y.id===x.id});return x.q+'x '+(m?m.name:'')}).join(' + ');if(pon(i))d=(d?d+' · ':'')+'Promoção '+i.pr.pct+'% off';rows.push([i.name,d,i.v.map(function(v){return[v.l,ep(i,v.p)]})])});M.push([c.k,c.n,c.s,rows])});
 S.items.forEach(function(i){if(i.cat==='vinhos'&&i.on){V.push(i.name+'|');if(i.v[0].p!=null)WP[i.name]=ep(i,i.v[0].p)}});
 return{M:M,V:V.join('\n'),WP:WP,open:S.open,wa:String(S.cfg.wa).replace(/\D/g,'')}}
function siteHtml(){var c=JSON.stringify(build()).replace(/</g,'\\u003c');return JSON.parse($('site').textContent).replace('/*DVCAT*/',function(){return c})}
function bar(){var n=S.rev-S.pub;return (me&&me.def?'<div class="pub dirty" role="alert"><span><b>Senha padrão em uso.</b> Troque agora para proteger o painel.</span><button class="btn s p" onclick="nav(\'cfg\')">Trocar senha</button></div>':'')+'<div class="pub'+(n>0?' dirty':'')+'" role="status"><span>'+(n>0?'<b>'+n+' alteraç'+(n>1?'ões':'ão')+'</b> ainda não '+(n>1?'estão':'está')+' no cardápio':'Cardápio publicado e em dia')+'</span><button class="btn s" onclick="pvw()">Prévia</button><button class="btn s p" onclick="pub()">Publicar no cardápio</button></div>'}
function pvw(){$('pvf').srcdoc=siteHtml();$('pvd').showModal()}
function pub(){dl('domvinho.html',siteHtml()).then(function(){S.pub=S.rev;save();draw();toast('Cardápio gerado. Envie domvinho.html ao seu site.')},function(e){toast(e&&e.code==='declined'?'Download cancelado':'Não foi possível gerar o arquivo')})}
/* combos */
function csum(i){var s=0;(i.inc||[]).forEach(function(x){var m=S.items.find(function(y){return y.id===x.id});if(m&&m.v[0]&&m.v[0].p!=null)s+=ep(m,m.v[0].p)*x.q});return r2(s)}
function combos(){var l=S.items.filter(function(i){return i.cat==='combos'});return '<div class="top"><div><h1>Combos</h1><p class="lead">Monte combos com itens do catálogo. A soma usa os preços atuais.</p></div><button class="btn p" onclick="ecb(0)">Novo combo</button></div><div class="list">'+(l.length?l.map(function(i){var s=csum(i),p=i.v[0].p;return '<div class="li"><div><div class="nm">'+esc(i.name)+(i.on?'':' <span class="tag">Pausado</span>')+'</div><small>'+(i.inc||[]).map(function(x){var m=S.items.find(function(y){return y.id===x.id});return x.q+'× '+(m?esc(m.name):'item removido')}).join(' + ')+'</small><br><small>Soma '+R(s)+(p!=null&&s>p?' · economia de <b>'+R(r2(s-p))+'</b> ('+Math.round((s-p)/s*100)+'%)':p!=null&&s<p?' · acima da soma dos itens':'')+'</small></div><b>'+R(p)+'</b><button class="btn s" onclick="ecb('+i.id+')">Editar</button></div>'}).join(''):'<div class="empty">Nenhum combo ainda. Crie o primeiro, por exemplo costelão com duas cervejas.</div>')+'</div>'}
function ecb(id){var i=id?S.items.find(function(x){return x.id===id}):{id:0,cat:'combos',grp:'',name:'',desc:'',v:[{l:'',p:null}],on:true,inc:[{id:0,q:1}]};window.E=JSON.parse(JSON.stringify(i));cfm()}
function cfm(){var seen={},o='';S.items.forEach(function(i){if(i.cat!=='combos'&&!seen[i.name]){seen[i.name]=1;o+='<option value="'+esc(i.name)+'">'}});$('dl').innerHTML=o;var i=E;$('dlg').innerHTML='<form onsubmit="return sc2(event)"><h2>'+(i.id?'Editar combo':'Novo combo')+'</h2><label>Nome do combo<input id="fn" required value="'+esc(i.name)+'"></label><label>Descrição (opcional)<input id="fd" value="'+esc(i.desc)+'"></label><label>Preço do combo (R$)<input id="fp" inputmode="decimal" required value="'+(i.v[0].p==null?'':String(i.v[0].p).replace('.',','))+'"></label><div class="mt">Itens do combo</div>'+i.inc.map(function(x,k){var m=S.items.find(function(y){return y.id===x.id});return '<div class="vr" style="grid-template-columns:1fr 70px 44px"><input class="cn" list="dl" placeholder="Buscar item" value="'+esc(m?m.name:'')+'"><input class="cq" type="number" min="1" value="'+x.q+'" aria-label="Quantidade"><button type="button" class="btn s" aria-label="Remover" onclick="cr('+k+')">✕</button></div>'}).join('')+'<button type="button" class="btn s" onclick="ca()">Adicionar item</button><div class="mt" id="cs"></div><label style="grid-auto-flow:column;justify-content:start;align-items:center;gap:8px"><input type="checkbox" id="fo" style="width:auto;min-height:0"'+(i.on?' checked':'')+'>Disponível no cardápio</label><div class="fa">'+(i.id?'<button type="button" class="btn d" onclick="del()">Excluir</button>':'')+'<button type="button" class="btn" onclick="$(\'dlg\').close()">Cancelar</button><button class="btn p">Salvar combo</button></div></form>';if(!$('dlg').open)$('dlg').showModal()}
function crd(){E.name=$('fn').value;E.desc=$('fd').value;E.v=[{l:'',p:pn($('fp').value)}];E.on=$('fo').checked;var n=document.querySelectorAll('.cn'),q=document.querySelectorAll('.cq');E.inc=[].map.call(n,function(x,k){var m=S.items.find(function(y){return y.cat!=='combos'&&y.name===x.value});return{id:m?m.id:0,q:Math.max(1,parseInt(q[k].value)||1)}})}
function ca(){crd();E.inc.push({id:0,q:1});cfm()}function cr(k){crd();E.inc.splice(k,1);if(!E.inc.length)E.inc.push({id:0,q:1});cfm()}
function sc2(e){e.preventDefault();crd();E.inc=E.inc.filter(function(x){return x.id});if(!E.inc.length){toast('Escolha ao menos um item da lista');return false}window.NEWI=!E.id;if(E.id){S.items[S.items.findIndex(function(x){return x.id===E.id})]=E}else{E.id=Math.max.apply(0,S.items.map(function(x){return x.id}))+1;S.items.unshift(E)}chg('Combo '+(window.NEWI?'criado':'editado')+': '+E.name+' ('+R(E.v[0].p)+')');$('dlg').close();draw();toast('Combo salvo');return false}
/* preços em massa */
function copts(all){return (all?'<option value="">Todas as categorias</option>':'')+S.cats.filter(function(c){return c.k!=='combos'}).map(function(c){return '<option value="'+c.k+'">'+esc(c.n)+'</option>'}).join('')}
function bset(){var c=$('bc').value,t=$('bt').value,v=pn($('bv').value.replace('-','')),neg=/^\s*-/.test($('bv').value);if(v==null)return null;if(neg)v=-v;var it=S.items.filter(function(i){return i.cat!=='combos'&&(!c||i.cat===c)&&i.v.some(function(x){return x.p!=null})});return{it:it,f:function(p){return p==null?null:Math.max(0,r2(t==='pct'?p*(1+v/100):p+v))}}}
function bp(){var b=bset(),e=$('bpv');if(!b||!b.it.length){e.textContent='Informe um valor para ver a prévia.';return}var x=b.it[0],p=x.v.find(function(y){return y.p!=null}).p;e.textContent=b.it.length+' itens serão alterados. Exemplo: '+x.name+', '+R(p)+' → '+R(b.f(p))+'.'}
function bk(e){e.preventDefault();var b=bset();if(!b||!b.it.length){toast('Informe um valor válido');return false}ask('Reajustar '+b.it.length+' itens? Você poderá desfazer em seguida.',function(){bk2(b)});return false}function bk2(b){var u={};b.it.forEach(function(i){u[i.id]=i.v.map(function(x){return x.p});i.v.forEach(function(x){x.p=b.f(x.p)})});S.undo=u;chg('Reajuste de '+$('bv').value+($('bt').value==='pct'?'%':' R$')+' em '+(cn($('bc').value)||'todas as categorias')+': '+b.it.length+' itens');draw();toast('Reajuste aplicado');return false}
function un(){if(!S.undo)return;S.items.forEach(function(i){var u=S.undo[i.id];if(u)i.v.forEach(function(x,k){x.p=u[k]})});S.undo=null;chg('Último reajuste desfeito');draw();toast('Reajuste desfeito')}
function pm(e){e.preventDefault();var d=pn($('pd').value),c=$('pc').value;if(!(d>0)){toast('Informe o desconto');return false}var n=0;S.items.forEach(function(i){if(i.cat!=='combos'&&(!c||i.cat===c)&&i.v.some(function(x){return x.p!=null})){i.pr={pct:Math.min(d,90),until:$('pu').value};n++}});chg('Promoção de '+d+'% em '+(cn(c)||'todas as categorias')+': '+n+' itens'+($('pu').value?' até '+$('pu').value.split('-').reverse().join('/'):''));draw();toast('Promoção ativada');return false}
function pe(){var n=0;S.items.forEach(function(i){if(i.pr){i.pr=null;n++}});chg('Promoções encerradas: '+n+' itens');draw();toast('Promoções encerradas')}
function prices(){return '<div class="top"><div><h1>Preços</h1><p class="lead">Reajuste em massa, promoções e o histórico de tudo que mudou.</p></div></div><div class="two"><form class="list fc" onsubmit="return bk(event)"><h2>Reajuste em massa</h2><label>Categoria<select id="bc" onchange="bp()">'+copts(1)+'</select></label><label>Tipo<select id="bt" onchange="bp()"><option value="pct">Percentual (%)</option><option value="fix">Valor fixo (R$)</option></select></label><label>Valor (negativo reduz)<input id="bv" inputmode="decimal" placeholder="Ex.: 5 ou -2,50" oninput="bp()"></label><p class="mt" id="bpv">Informe um valor para ver a prévia.</p><div class="fa"><button class="btn" type="button" onclick="un()"'+(S.undo?'':' disabled')+'>Desfazer último</button><button class="btn p">Aplicar reajuste</button></div></form><form class="list fc" onsubmit="return pm(event)"><h2>Promoção por categoria</h2><label>Categoria<select id="pc">'+copts(1)+'</select></label><label>Desconto (%)<input id="pd" inputmode="decimal" required placeholder="Ex.: 10"></label><label>Válida até (opcional)<input id="pu" type="date"></label><div class="fa"><button type="button" class="btn d" onclick="pe()">Encerrar todas</button><button class="btn p">Ativar promoção</button></div></form></div><h2 style="margin:30px 0 12px">Histórico de alterações</h2><div class="list">'+(S.log.length?S.log.slice(0,60).map(function(l){return '<div class="li"><div>'+esc(l.m)+'</div><small>'+fd(l.t)+'</small></div>'}).join(''):'<div class="empty">Nenhuma alteração registrada ainda.</div>')+'</div>'}

var FL=0,LK=0;
function H(u,p){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('dv:'+u+':'+p)).then(function(d){return[].map.call(new Uint8Array(d),function(x){return('0'+x.toString(16)).slice(-2)}).join('')})}
function did(){try{var d=localStorage.getItem('dv_dev');if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem('dv_dev',d)}return d}catch(e){return'x'}}
function dlab(){var m=/iPhone|iPad|Android|Windows|Macintosh|Linux/.exec(navigator.userAgent||'');return(m?m[0]:'Aparelho')+' · '+did().slice(0,4)}
function ensureAuth(){if(S.auth&&S.auth.users)return Promise.resolve();S.auth={restrict:true,devs:[],log:[],users:[{u:'admin',n:'Manutenção',role:'dev',on:true,def:true},{u:'israel',n:'Israel Pardim',role:'owner',on:true,def:true}]};return Promise.all(S.auth.users.map(function(x){return H(x.u,'admin').then(function(h){x.h=h})})).then(save)}
function lgin(e){e.preventDefault();if(Date.now()<LK){$('le').textContent='Muitas tentativas. Aguarde '+Math.ceil((LK-Date.now())/1e3)+'s.';return false}var u=$('lu').value.trim().toLowerCase(),p=$('lp').value,x=S.auth.users.find(function(y){return y.u===u});H(u,p).then(function(h){var er='';if(!x||x.h!==h)er='Usuário ou senha incorretos.';else if(!x.on)er='Este acesso está bloqueado. Fale com o suporte.';else if(x.role==='owner'&&S.auth.restrict&&S.auth.devs.every(function(d){return d.id!==did()}))er='Este aparelho não está autorizado. Peça ao suporte para liberar.';S.auth.log.unshift({t:Date.now(),u:u,ok:!er,d:dlab()});S.auth.log.length=Math.min(S.auth.log.length,50);if(er){if(++FL>=5){LK=Date.now()+3e4;FL=0}save();$('le').textContent=er;return}FL=0;me=x;x.last=Date.now();try{sessionStorage.setItem('dv_s',u)}catch(z){}save();$('le').textContent='';showApp()});return false}
function showLogin(){me=null;document.body.classList.add('lo');$('lp').value=''}
function showApp(){document.body.classList.remove('lo');V='home';draw();window.scrollTo(0,0)}
function out(){try{sessionStorage.removeItem('dv_s')}catch(e){}showLogin()}
function boot(){load();norm();ensureAuth().then(function(){var u;try{u=sessionStorage.getItem('dv_s')}catch(e){}var x=u&&S.auth.users.find(function(y){return y.u===u&&y.on});if(x){me=x;showApp()}else showLogin()})}
function ask(m,fn){window.CF=fn;$('cfd').innerHTML='<form method="dialog" style="padding:22px;display:grid;gap:14px"><h2>Confirmar</h2><p style="margin:0">'+esc(m)+'</p><div class="fa"><button class="btn" value="n">Cancelar</button><button class="btn p" value="y" onclick="$(\'cfd\').close();CF();return false">Confirmar</button></div></form>';$('cfd').showModal()}
function acct(){return '<h2 style="margin-top:30px">Minha conta</h2><form class="list fc" style="max-width:560px" onsubmit="return cpw(event)"><p class="mt" style="margin:0">Entrou como <b>'+esc(me.n)+'</b> ('+me.u+').</p><label>Senha atual<input id="pa" type="password" autocomplete="current-password" required></label><label>Nova senha (mínimo 6 caracteres)<input id="pn" type="password" autocomplete="new-password" required minlength="6"></label><label>Repita a nova senha<input id="pr" type="password" autocomplete="new-password" required></label><div class="fa"><button type="button" class="btn" onclick="out()">Sair</button><button class="btn p">Trocar senha</button></div></form>'}
function cpw(e){e.preventDefault();var a=$('pa').value,n=$('pn').value;if(n!==$('pr').value){toast('As senhas novas não conferem');return false}if(n.length<6||n==='admin'){toast('Escolha uma senha diferente de "admin", com 6 ou mais caracteres');return false}H(me.u,a).then(function(h){if(h!==me.h){toast('Senha atual incorreta');return}return H(me.u,n).then(function(h2){me.h=h2;me.def=false;save();draw();toast('Senha alterada')})});return false}
function access(){var A=S.auth;return '<div class="top"><div><h1>Acessos</h1><p class="lead">Quem entra, de onde e com qual senha. Só a Manutenção vê esta tela.</p></div></div><div class="list">'+A.users.map(function(x){return '<div class="li"><div><b>'+esc(x.n)+'</b> <span class="tag">'+(x.role==='dev'?'Manutenção':'Proprietário')+'</span>'+(x.on?'':' <span class="tag st-Cancelado">Bloqueado</span>')+'<br><small>Usuário '+x.u+(x.last?' · último acesso '+fd(x.last):'')+(x.def?' · senha padrão':'')+'</small></div><button class="btn s" onclick="rpw(\''+x.u+'\')">Redefinir senha</button>'+(x.role==='owner'?'<button class="btn s" onclick="ban(\''+x.u+'\')">'+(x.on?'Bloquear':'Liberar')+'</button>':'')+'</div>'}).join('')+'</div><h2 style="margin:30px 0 12px">Aparelhos do Israel</h2><div class="list"><div class="li"><div><b>Restringir a aparelhos autorizados</b><br><small>Com isto ligado, o Israel só entra nos aparelhos da lista. A Manutenção entra de qualquer lugar.</small></div><button class="sw" role="switch" aria-label="Restringir por aparelho" aria-checked="'+A.restrict+'" onclick="S.auth.restrict=!S.auth.restrict;save();draw()"></button></div>'+(A.devs.length?A.devs.map(function(d){return '<div class="li"><div><b>'+esc(d.n)+'</b><br><small>Autorizado em '+fd(d.t)+(d.id===did()?' · este aparelho':'')+'</small></div><button class="btn s d" onclick="rdev(\''+d.id+'\')">Remover</button></div>'}).join(''):'<div class="empty">Nenhum aparelho autorizado. Autorize o aparelho do Israel.</div>')+'<div class="li"><button class="btn s p" onclick="adev()">Autorizar este aparelho</button></div></div><h2 style="margin:30px 0 12px">Últimos acessos</h2><div class="list">'+(A.log.length?A.log.slice(0,15).map(function(l){return '<div class="li"><div><b>'+esc(l.u||'?')+'</b> <span class="tag '+(l.ok?'st-Pronto':'st-Cancelado')+'">'+(l.ok?'Entrou':'Recusado')+'</span><br><small>'+esc(l.d)+'</small></div><small>'+fd(l.t)+'</small></div>'}).join(''):'<div class="empty">Nenhum acesso registrado.</div>')+'</div>'}
function rpw(u){ask('Redefinir a senha de "'+u+'" para "admin"? A pessoa precisará trocá-la ao entrar.',function(){var x=S.auth.users.find(function(y){return y.u===u});H(u,'admin').then(function(h){x.h=h;x.def=true;save();draw();toast('Senha redefinida')})})}
function ban(u){var x=S.auth.users.find(function(y){return y.u===u});x.on=!x.on;save();draw();toast(x.on?'Acesso liberado':'Acesso bloqueado')}
function adev(){if(!S.auth.devs.some(function(d){return d.id===did()})){S.auth.devs.push({id:did(),n:dlab(),t:Date.now()});save()}draw();toast('Aparelho autorizado')}
function rdev(id){S.auth.devs=S.auth.devs.filter(function(d){return d.id!==id});save();draw();toast('Aparelho removido')}
boot();
</script></body></html>
